apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: trustpolicies.aegischain.dev
spec:
  group: aegischain.dev
  names:
    kind: TrustPolicy
    listKind: TrustPolicyList
    plural: trustpolicies
    singular: trustpolicy
    shortNames:
      - tp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                    - enforce
                    - audit
                  default: enforce
                requireSignatures:
                  type: boolean
                  default: true
                allowedIdentities:
                  type: array
                  items:
                    type: string
                allowedIssuers:
                  type: array
                  items:
                    type: string
                requireProvenance:
                  type: boolean
                  default: true
                trustedBuilders:
                  type: array
                  items:
                    type: string
                expectedSourceRepo:
                  type: string
                requireSBOM:
                  type: boolean
                  default: true
                minSBOMComponents:
                  type: integer
                  default: 1
                maxVulnerabilitySeverity:
                  type: string
                  enum:
                    - CRITICAL
                    - HIGH
                    - MEDIUM
                    - LOW
                  default: CRITICAL
                blockKEV:
                  type: boolean
                  default: true
                maxDependencyRiskScore:
                  type: integer
                  default: 65
                antiRollback:
                  type: boolean
                  default: true
                maxImageAgeDays:
                  type: integer
                  default: 30
                breakGlass:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    emergencyKey:
                      type: string
              required:
                - mode
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
