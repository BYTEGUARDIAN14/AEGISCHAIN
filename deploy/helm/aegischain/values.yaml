replicaCount: 2

image:
  repository: ghcr.io/byteaegis/aegischain
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

serviceAccount:
  create: true
  name: "aegischain-sa"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8443

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

webhook:
  failurePolicy: Fail
  timeoutSeconds: 5
  certManager:
    enabled: true

policies:
  enforceDefault: true
  auditNamespaces:
    - staging
    - dev
  enforceNamespaces:
    - prod
    - default
