apiVersion: v1
kind: Namespace
metadata:
  name: aegischain-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    aegischain.dev/mode: enforce
---
apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    aegischain.dev/mode: audit
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegischain-admission-webhook
  namespace: aegischain-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aegischain-admission-webhook
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "events", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aegischain.dev"]
    resources: ["trustpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegischain-admission-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aegischain-admission-webhook
subjects:
  - kind: ServiceAccount
    name: aegischain-admission-webhook
    namespace: aegischain-system
---
apiVersion: v1
kind: Service
metadata:
  name: aegischain-admission-webhook
  namespace: aegischain-system
  labels:
    app.kubernetes.io/name: aegischain-admission-webhook
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 8443
      protocol: TCP
      name: https
  selector:
    app.kubernetes.io/name: aegischain-admission-webhook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegischain-admission-webhook
  namespace: aegischain-system
  labels:
    app.kubernetes.io/name: aegischain-admission-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aegischain-admission-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegischain-admission-webhook
    spec:
      serviceAccountName: aegischain-admission-webhook
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      hostAliases:
        - ip: "172.19.0.3"
          hostnames:
            - "aegis-registry"
      containers:
        - name: webhook
          image: localhost:5001/aegischain-admission-webhook:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: AEGISCHAIN_REGISTRY_MAP
              value: "localhost:5001=aegis-registry:5000"
          args:
            - "--port=8443"
            - "--tls-cert-file=/app/certs/tls.crt"
            - "--tls-key-file=/app/certs/tls.key"
            - "--policies-dir=/app/policies"
            - "--data-dir=/app/policies/data"
            - "--public-key=/app/deploy/keys/cosign.pub"
            - "--enforce-namespaces=prod,default"
            - "--audit-namespaces=staging,dev"
            - "--default-mode=enforce"
            - "--timeout=5"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tls-certs
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: tls-certs
          secret:
            secretName: aegischain-webhook-tls
