run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - unconvert

linters-settings:
  gosec:
    excludes:
      - G104 # Audit errors not checked (handled by errcheck)
      - G304 # File path provided as taint input in CLI/testing
      - G204 # Subprocess launched with variable arguments in CLI/webhook
