name: Reusable Hardened Supply Chain Pipeline

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        description: Target container image repository (e.g. ghcr.io/org/repo)
      dockerfile:
        required: false
        type: string
        default: Dockerfile
        description: Path to Dockerfile
      context:
        required: false
        type: string
        default: .
        description: Build context path
    outputs:
      image_digest:
        description: Cryptographically resolved SHA-256 digest of the built artifact
        value: ${{ jobs.build-and-sign.outputs.image_digest }}

permissions: {}

jobs:
  build-and-sign:
    name: Hermetic Build, Scan, Attest, and Sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required strictly for Fulcio OIDC keyless signing
    outputs:
      image_digest: ${{ steps.build.outputs.image_digest }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@91182c01eb212526b6cb4b51a5b748055a71600c # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.17.3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image (No Cache on Release)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.image_name }}:${{ github.sha }}
          no-cache: true

      - name: Extract Image Digest
        id: digest
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          echo "image_digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "Built artifact digest: ${DIGEST}"

      - name: Generate CycloneDX and SPDX SBOMs via Syft
        run: |
          IMAGE_URI="${{ inputs.image_name }}@${{ steps.digest.outputs.image_digest }}"
          syft "${IMAGE_URI}" -o cyclonedx-json=cyclonedx.json -o spdx-json=spdx.json

      - name: Run Vulnerability Scan via Trivy
        uses: aquasecurity/trivy-action@6e7b7f1fb3e46a7816d368d4465e40643c2733b0 # 0.24.0
        with:
          image-ref: "${{ inputs.image_name }}@${{ steps.digest.outputs.image_digest }}"
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Keyless Sign Container Image via Cosign
        run: |
          cosign sign --yes "${{ inputs.image_name }}@${{ steps.digest.outputs.image_digest }}"

      - name: Keyless Attest CycloneDX SBOM
        run: |
          cosign attest --yes \
            --predicate cyclonedx.json \
            --type https://cyclonedx.org/schema \
            "${{ inputs.image_name }}@${{ steps.digest.outputs.image_digest }}"

      - name: Keyless Attest Vulnerability Scan
        run: |
          cosign attest --yes \
            --predicate trivy-report.json \
            --type https://cosign.sigstore.dev/attestation/vuln/v1 \
            "${{ inputs.image_name }}@${{ steps.digest.outputs.image_digest }}"
