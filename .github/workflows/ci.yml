name: AegisChain Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@91182c01eb212526b6cb4b51a5b748055a71600c # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@971e284b6050e8a58491740704447943d7e21d70 # v6.1.1
        with:
          version: v1.61.0

  unit-tests:
    name: Go Unit Tests and Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@91182c01eb212526b6cb4b51a5b748055a71600c # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run Tests with Race Detector
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

  rego-policy-tests:
    name: OPA Rego Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@91182c01eb212526b6cb4b51a5b748055a71600c # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@b6a3b2b8e62d499a0937a4c7f0db43d5c5f4989d # v2.2.0
        with:
          version: v0.69.0

      - name: Run OPA Policy Tests
        run: |
          opa test policies/rego policies/rego_test -v --coverage

  build-verification:
    name: Reproducible Build Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@91182c01eb212526b6cb4b51a5b748055a71600c # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build Binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/aegischain ./cmd/aegischain
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/trust-engine ./cmd/trust-engine
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/admission-webhook ./cmd/admission-webhook
